<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div id="app">
      <div class="topbar">
        <div class="brand">
          <span class="dotmark"></span>
          <span>greytHR</span>
        </div>
        <div class="datenav">
          <button id="prevDay" class="nav" title="Previous day">‹</button>
          <button id="dateLabel" class="datelabel" title="Jump to today">Today</button>
          <button id="nextDay" class="nav" title="Next day">›</button>
        </div>
        <button id="refresh" class="icon" title="Refresh">⟳</button>
      </div>

      <div id="notice" class="notice hidden"></div>

      <div id="state" class="state hidden"></div>

      <div id="main" class="hidden">
        <div class="ringwrap" id="ringBtn" title="Tap to switch view">
          <svg viewBox="0 0 120 120" class="ring">
            <defs>
              <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
                <stop class="g1" offset="0%" stop-color="#3b82f6" />
                <stop class="g2" offset="100%" stop-color="#6366f1" />
              </linearGradient>
            </defs>
            <circle class="ring-bg" cx="60" cy="60" r="52" />
            <circle id="ringFg" class="ring-fg" cx="60" cy="60" r="52" />
          </svg>
          <div class="ringcenter">
            <div class="ringlabel" id="centerLabel">left</div>
            <div class="ringvalue" id="centerValue">--</div>
            <div class="pill" id="statusPill">--</div>
            <div class="dots" id="modeDots"></div>
          </div>
        </div>

        <div class="stats">
          <div class="stat">
            <span class="statlabel">Worked</span>
            <b id="worked">--</b>
          </div>
          <div class="stat">
            <span class="statlabel" id="lblB">Break left</span>
            <b id="statB">--</b>
          </div>
          <div class="stat">
            <span class="statlabel" id="lblC">Leave at</span>
            <b id="statC">--</b>
          </div>
          <div class="stat">
            <span class="statlabel">First in</span>
            <b id="firstIn">--</b>
          </div>
        </div>

        <div class="tl-head hidden" id="tlHead">Swipes</div>
        <div class="timeline" id="timeline"></div>

        <button id="monthToggle" class="monthtoggle">
          <span>Month overview</span>
          <span class="chev" id="chev">▸</span>
        </button>
        <div id="monthPanel" class="monthpanel hidden"></div>
      </div>

      <div id="gameView" class="hidden">
        <div id="gameMenu">
          <div class="game-head">
            <button id="gameMenuBack" class="nav" title="Back">‹</button>
            <span class="game-title">🎮 Games</span>
          </div>
          <div class="game-cards">
            <button class="game-card" data-game="snake"><span class="gc-emoji">🐍</span>Snake</button>
            <button class="game-card" data-game="tetris"><span class="gc-emoji">🧱</span>Blocks</button>
            <button class="game-card" data-game="breakout"><span class="gc-emoji">🎯</span>Breakout</button>
            <button class="game-card" data-game="flappy"><span class="gc-emoji">🐤</span>Flappy</button>
            <button class="game-card" data-game="word"><span class="gc-emoji">🔤</span>Word</button>
          </div>
          <div class="game-hint">Pick a game — your high scores are saved.</div>
          <div class="game-played" id="gamePlayed"></div>
        </div>

        <div id="gamePlay" class="hidden">
          <div class="game-head">
            <button id="gameBack" class="nav" title="Back to games">‹</button>
            <span class="game-title" id="gameTitle">Snake</span>
            <span class="game-scores">
              <span id="gameScore">0</span> · best <span id="gameHigh">0</span>
            </span>
          </div>
          <div class="game-stage">
            <canvas id="gameCanvas" width="320" height="320" tabindex="0"></canvas>
          </div>
          <div class="game-hint" id="gameHint"></div>
        </div>
      </div>

      <div class="footer">
        <a id="openPortal" href="#">Open greytHR ↗</a>
        <a id="openGame" href="#" title="Take a break">🎮 Games</a>
        <a id="openOptions" href="#">Settings</a>
      </div>
      <div id="bgStatus" class="bgstatus"></div>
    </div>
    <script type="module" src="popup.js"></script>
  </body>
</html>
